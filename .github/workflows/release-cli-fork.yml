name: release-cli-fork

on:
  push:
    tags:
      - "v*openwork*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (for example v1.1.60-openwork.2)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-cli-fork-${{ github.ref }}-${{ github.event.inputs.tag || '' }}
  cancel-in-progress: false

jobs:
  release-cli:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Install dependencies
        run: bun install

      - name: Resolve tag and version
        id: meta
        env:
          INPUT_TAG: ${{ github.event.inputs.tag || '' }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG}"
          if [ -z "$tag" ]; then
            tag="${GITHUB_REF_NAME}"
          fi

          if [[ "$tag" != v* ]]; then
            tag="v${tag}"
          fi

          version="${tag#v}"
          if [ -z "$version" ]; then
            echo "Unable to resolve release version from tag: $tag" >&2
            exit 1
          fi

          git fetch --tags --prune
          git checkout "$tag"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Ensure GitHub release exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes "Fork CLI release for OpenWork."

      - name: Build and upload CLI assets
        env:
          OPENCODE_VERSION: ${{ steps.meta.outputs.version }}
          OPENCODE_RELEASE: "1"
          GH_TOKEN: ${{ github.token }}
        run: ./packages/opencode/script/build.ts
